name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Compile and Build App
        run: |
          python -m pip install --upgrade pip
          
          # THE IRON-CLAD LOCK: Force the exact latest engines so the system can't panic!
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu==0.26.dev246 mlc-llm-nightly-cpu==0.26.dev4
          
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export MLC_LLM_SOURCE_DIR=/home/runner/work/mlc-llm/mlc-llm
          
          cd android/MLCChat
          python -m mlc_llm package
          
          chmod +x ./gradlew
          ./gradlew assembleDebug
