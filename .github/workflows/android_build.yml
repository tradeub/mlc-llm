name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android

      - name: Setup Stable Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile and Build App
        run: |
          python -m pip install --upgrade pip

          # --- THE ROGUE MECHANIC BYPASS ---
          python -m pip install apache-tvm-ffi==0.1.13rc2
          python -m pip install numpy transformers fastapi uvicorn pydantic shortuuid requests tqdm scipy psutil ml_dtypes
          python -m pip install --pre -U --no-deps -f https://mlc.ai/wheels mlc-ai-nightly-cpu==0.26.dev246 mlc-llm-nightly-cpu==0.26.dev4
          
          # Fix the developers' typo dynamically
          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])")
          sed -i 's/var.name_hint/getattr(var, "name_hint", "v")/g' $SITE_PKG/mlc_llm/compiler_pass/scatter_tuple_get_item.py
          # ---------------------------------

          # --- THE IRON-CLAD ADDRESS & TRANSLATOR PEN ---
          # Look directly at the giant neon sign the NDK sets up!
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export TVM_NDK_CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          
          # Give the Rust Translator the REAL, valid pen!
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TVM_NDK_CC
          # -----------------------------
          
          export MLC_LLM_SOURCE_DIR=/home/runner/work/mlc-llm/mlc-llm

          cd android/MLCChat
          python -m mlc_llm package

          chmod +x ./gradlew
          ./gradlew assembleDebug

      # --- YOUR SURPRISE! ---
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Assistant-APK
          path: android/MLCChat/app/build/outputs/apk/debug/app-debug.apk
