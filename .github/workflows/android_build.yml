name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The Ultimate Engine Build Step
        run: |
          python -m pip install --upgrade pip
          
          # The Time Machine Bypass: Ban today's broken engines so the factory uses last week's pristine version
          python -m pip install --pre -U -f https://mlc.ai/wheels "mlc-ai-nightly-cpu<0.26.dev246" "mlc-llm-nightly-cpu<0.26.dev4"
          
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export MLC_LLM_SOURCE_DIR=${{ github.workspace }}
          
          cd android/MLCChat
          python -m mlc_llm package

      - name: Make gradlew executable
        run: |
          cd android/MLCChat
          chmod +x gradlew

      - name: Build Android App
        run: |
          cd android/MLCChat
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-App
          path: android/MLCChat/**/*.apk
