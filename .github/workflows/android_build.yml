name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Compiler (MLC LLM)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu mlc-llm-nightly-cpu

      - name: Compile the C++ AI Engine (mlc4j)
        run: |
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export MLC_LLM_SOURCE_DIR=${{ github.workspace }}
          export PATH="$HOME/.local/bin:$PATH"
          cd android/MLCChat
          mlc_llm package

      - name: Make gradlew executable
        run: |
          cd android/MLCChat
          chmod +x gradlew

      - name: Build Android App
        run: |
          cd android/MLCChat
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-App
          path: android/MLCChat/**/*.apk
