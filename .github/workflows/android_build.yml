name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The Ultimate Engine Build Step
        run: |
          # 1. Force the working part (0.1.12) to bypass the manufacturer's broken update!
          python -m pip install --upgrade pip
          python -m pip install --pre -U -f https://mlc.ai/wheels "apache-tvm-ffi==0.1.12" "mlc-ai-nightly-cpu>=0.20" "mlc-llm-nightly-cpu>=0.20"
          
          # 2. Set the variables
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export MLC_LLM_SOURCE_DIR=${{ github.workspace }}
          
          # 3. Enter the folder and command Python to package the engine directly
          cd android/MLCChat
          python -m mlc_llm package

      - name: Make gradlew executable
        run: |
          cd android/MLCChat
          chmod +x gradlew

      - name: Build Android App
        run: |
          cd android/MLCChat
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-App
          path: android/MLCChat/**/*.apk
